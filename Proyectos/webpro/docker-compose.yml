version: "3.9"
services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./www:/var/www
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    container_name: php_server
    volumes:
      - ./www:/var/www
